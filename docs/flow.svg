<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 960 280" width="960" height="280" role="img" aria-labelledby="t d">
<title id="t">How pi-mcp-events works</title>
<desc id="d">An MCP server from pi's mcp.json sends an event by push (events/stream) or poll (events/poll). pi-mcp-events drops duplicates, saves the cursor, and wraps the data as untrusted input. It then wakes the pi session: an idle session starts a turn, a busy one gets a follow-up.</desc>
<style>
.h{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){.dot{display:none}}
</style>
<rect y="50" width="960" height="280" rx="12" fill="#0d1117"/>

<!-- MCP server -->
<rect x="24" y="80" width="230" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="42" y="110" fill="#79c0ff" class="m" font-size="15" font-weight="700">MCP server</text>
<text x="42" y="134" fill="#8b949e" class="m" font-size="12">any server in mcp.json</text>
<text x="42" y="154" fill="#8b949e" class="m" font-size="12">stdio or HTTP</text>
<text x="42" y="174" fill="#8b949e" class="m" font-size="12">e.g. letagents mcp</text>

<!-- extension -->
<rect x="365" y="80" width="250" height="110" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
<text x="383" y="110" fill="#e3b341" class="m" font-size="15" font-weight="700">pi-mcp-events</text>
<text x="383" y="134" fill="#8b949e" class="m" font-size="12">drop duplicate eventIds</text>
<text x="383" y="154" fill="#8b949e" class="m" font-size="12">save the cursor</text>
<text x="383" y="174" fill="#8b949e" class="m" font-size="12">mark data as untrusted</text>

<!-- pi session -->
<rect x="706" y="80" width="230" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="724" y="110" fill="#7ee787" class="m" font-size="15" font-weight="700">pi session</text>
<text x="724" y="134" fill="#8b949e" class="m" font-size="12">idle: starts a turn</text>
<text x="724" y="154" fill="#8b949e" class="m" font-size="12">busy: runs it next</text>
<text x="724" y="174" fill="#8b949e" class="m" font-size="12">no prompt from you</text>

<!-- arrows -->
<path id="a1" d="M254,135 L365,135" fill="none" stroke="#30363d" stroke-width="1.5"/>
<path d="M357,130 L365,135 L357,140" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="309" y="120" fill="#d2a8ff" class="m" font-size="11" text-anchor="middle">event</text>
<text x="309" y="156" fill="#8b949e" class="m" font-size="10" text-anchor="middle">push or poll</text>

<path id="a2" d="M615,135 L706,135" fill="none" stroke="#30363d" stroke-width="1.5"/>
<path d="M698,130 L706,135 L698,140" fill="none" stroke="#30363d" stroke-width="1.5"/>
<text x="660" y="120" fill="#d2a8ff" class="m" font-size="11" text-anchor="middle">wake</text>

<!-- files -->
<path d="M490,190 L490,232" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="335" y="232" width="310" height="66" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="351" y="257" fill="#e6edf3" class="m" font-size="12">~/.pi/agent/mcp-events.json</text>
<text x="351" y="275" fill="#8b949e" class="m" font-size="11">subscriptions for every session</text>
<text x="351" y="291" fill="#8b949e" class="m" font-size="11">+ mcp-events-state.json: cursors</text>

<path d="M139,190 L139,232" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="24" y="232" width="230" height="66" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="40" y="257" fill="#e6edf3" class="m" font-size="12">~/.pi/agent/mcp.json</text>
<text x="40" y="275" fill="#8b949e" class="m" font-size="11">pi's own server config,</text>
<text x="40" y="291" fill="#8b949e" class="m" font-size="11">no adapter, no fork</text>

<path d="M821,190 L821,232" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="706" y="232" width="230" height="66" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="722" y="257" fill="#e6edf3" class="m" font-size="12">tools for the agent</text>
<text x="722" y="275" fill="#8b949e" class="m" font-size="11">mcp_events_list</text>
<text x="722" y="291" fill="#8b949e" class="m" font-size="11">mcp_events_(un)subscribe</text>

<!-- moving event -->
<circle class="dot" r="5" fill="#d2a8ff">
  <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.45;1" calcMode="linear" path="M254,135 L365,135"/>
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.46;1" dur="3s" repeatCount="indefinite"/>
</circle>
<circle class="dot" r="5" fill="#d2a8ff" opacity="0">
  <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.55;0.9;1" calcMode="linear" path="M615,135 L706,135"/>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.55;0.9;1" dur="3s" repeatCount="indefinite"/>
</circle>
</svg>
